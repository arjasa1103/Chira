name: collector

# The forward prices-only collector (PLAN.md Phase 6). Live since 2026-09-28.
#
# WHY IT FIRES EVERY 30 MINUTES. The poll window is 16:00-02:30 ET (20:00-06:30
# UTC under EDT, 21:00-07:30 under EST). It used to be covered by two crons
# aimed at the window, `0 20` and `45 1`. GitHub delivered them hours late:
# measured 2026-09-28/30, 3h22 to 5h45. The first slot started after early
# puck drops and the second landed wholly outside the window, polled nothing
# for 5h30 and still pinged success. No fixed cron can aim at a target when
# the delay is that large and that variable, so the schedule stops aiming:
#
#   - It fires every 30 minutes, at :17 and :47. GitHub's docs name the start
#     of every hour as the high-load time when scheduled runs are delayed or
#     dropped, so the minutes are chosen to avoid it.
#   - Each run decides for itself (chira.collector.window_is_too_far). Inside
#     the window it polls. Within EARLY_START_MINUTES of the opening it waits.
#     Further out it exits in about a minute, with no heartbeat, because it
#     collected nothing.
#   - A session ends at its 5h30 cap or when the window closes, whichever is
#     first. The concurrency group below then hands over to the next run.
#
# THE HANDOVER IS THE CONCURRENCY GROUP. While a session runs, the next
# scheduled run waits as pending; a newer one replaces it, and the replaced
# run shows as "cancelled" in the Actions list. That is expected and not a
# failure. When the session ends, the pending run starts at once, so the
# window is covered by a chain of sessions whatever the cron delay is. A hand
# dispatch joins the same queue.
#
# The real gate is computed in America/New_York inside collector.py, so a DST
# shift moves the effective window and not the coverage. Every row carries its
# own capture timestamp, and the external monitor (Healthchecks.io, via the
# CHIRA_HEARTBEAT_URL secret) is what notices a night with no session at all.
on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 min; each run decides whether to poll
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide everything, touch no network"
        type: boolean
        default: true
      once:
        description: "One poll cycle, then stop (a real session runs 5h30)"
        type: boolean
        default: false

# `schedule` and `workflow_dispatch` only: never a fork-triggerable trigger,
# because this job reads a secret. A `pull_request` trigger here would expose
# the heartbeat URL to any fork that opened a PR.
permissions:
  contents: read

concurrency:
  # One session at a time, and the handover mechanism (see the header): at most
  # one run in progress and one pending, the pending one replaced by newer
  # runs. cancel-in-progress stays false, or every 30-minute run would kill
  # the session it was meant to follow.
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 5h50, just above the session's own 5h30 stop
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --group dev

      - name: Report what a session would do
        # The secret is passed here only so the report states the heartbeat
        # truthfully; a dry run never pings. Without it this step printed
        # "no CHIRA_HEARTBEAT_URL set" on every run while the Collect step,
        # which does have it, delivered the ping.
        env:
          CHIRA_HEARTBEAT_URL: ${{ secrets.CHIRA_HEARTBEAT_URL }}
        run: uv run python scripts/run_collector.py --dry-run

      - name: Collect
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          # Absent in forks and in local runs, which `Heartbeat` reports rather
          # than failing on.
          CHIRA_HEARTBEAT_URL: ${{ secrets.CHIRA_HEARTBEAT_URL }}
        # A zero-capture run inside an open window exits 1 and fails the job
        # visibly (T14). Off-season it exits 0.
        #
        # `once` exists because a hand-run proof is otherwise unaffordable.
        # A scheduled session is MEANT to run 5h30 and poll the whole window;
        # proving the heartbeat reaches the monitor needs one cycle, and
        # burning a 5h30 job on it would eat a third of a day's free minutes.
        # It still runs the real gates and still pings, unlike `--force`,
        # because this IS a real session -- just a short one.
        run: |
          uv run python scripts/run_collector.py \
            ${{ github.event.inputs.once == 'true' && '--once' || '' }}

      # The quote store is NEVER committed to the tree (PLAN.md: "never commit a
      # growing DuckDB file into the git tree"). It leaves as a build artifact.
      - name: Upload quotes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-quotes-${{ github.run_id }}
          path: |
            data/collector/
            data/logs/collector.jsonl
          if-no-files-found: ignore
          retention-days: 90
