[project]
name = "chira"
version = "0.1.0"
description = "Cross-sport market calibration and win-probability engine, benchmarked against Polymarket closing prices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyarrow>=17.0",
    "nba_api>=1.5",
]

[project.optional-dependencies]
# JAX/numpyro is only needed from week 8 (the model). Kept out of the default
# install so weeks 1-7 do not pay for it.
model = [
    "numpyro>=0.15",
    "jax>=0.4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chira"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
